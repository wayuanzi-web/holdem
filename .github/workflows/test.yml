name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3'
      - name: 安裝 treys
        run: pip install treys
      - name: 跑全部測試
        run: sh test/run-all.sh
      - name: 建置產物同步檢查
        run: |
          python3 src/build.py https://wayuanzi-web.github.io/holdem/
          # sw.js 有版本戳記，每次建置都不同，所以不檢查
          if ! git diff --exit-code -- index.html manifest.webmanifest; then
            echo "::error::改了 src 要重新建置再 commit"
            exit 1
          fi
