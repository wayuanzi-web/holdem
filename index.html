/* 不配置記憶體，先估這棵樹要多少：決策點數、MB */
function estimateSolve(cfg) {
  const tree = buildTree(cfg);
  const dead = new Uint8Array(52);
  for (const c of cfg.board) dead[c] = 1;
  const n = [0, 0];
  for (let p = 0; p < 2; p++) for (let k = 0; k < NCOMBO; k++) if (cfg.ranges[p][k] > 0 && !dead[COMBO_A[k]] && !dead[COMBO_B[k]]) n[p]++;
  const D = 52 - cfg.board.length;
  let floats = 0, work = 0;
  for (const nd of tree.nodes) {
    const inst = Math.pow(D, nd.level);
    if (nd.kind === N_ACT) { floats += inst * nd.acts.length * n[nd.p]; work += inst * nd.acts.length * (n[0] + n[1]); }
    else if (nd.kind !== N_CHANCE) work += inst * (n[0] + n[1]) * 2;
  }
  // work：每次迭代大約要做的「手牌 × 動作」運算量，拿來從一個樹的實測時間推估另一個樹
  return { mb: floats * 8 / 1048576, n, stats: treeStats(tree), work, tree };
}

Solver.prototype.alloc = function (len) { const a = this.scr.subarray(this.sp, this.sp + len); this.sp += len; return a; };

/* 給 p 的每手牌：對手（到達機率 r）裡不跟它撞牌的總和 */
Solver.prototype.compat = function (p, r, out) {
  const o = 1 - p, HAo = this.HA[o], HBo = this.HB[o], ct = this.ct;
  ct.fill(0);
  let tot = 0;
  for (let j = 0, n = this.n[o]; j < n; j++) { const x = r[j]; if (x === 0) continue; tot += x; ct[HAo[j]] += x; ct[HBo[j]] += x; }
  const HA = this.HA[p], HB = this.HB[p], sm = this.same[p];
  for (let h = 0, n = this.n[p]; h < n; h++) { const s = sm[h]; out[h] = tot - ct[HA[h]] - ct[HB[h]] + (s >= 0 ? r[s] : 0); }
  return out;
};
Solver.prototype.pairWeight = function (w0, w1) {
  const c = this.compat(0, w1, new Float32Array(this.n[0]));
  let z = 0;
  for (let h = 0; h < this.n[0]; h++) z += w0[h] * c[h];
  return z;
};

/* 一個完整公牌（開始的公牌＋發的 ca、cb）的牌力排序 */
Solver.prototype.strengths = function (ca, cb) {
  const key = ca < 0 ? -1 : cb < 0 ? ca : (ca < cb ? ca * 52 + cb : cb * 52 + ca);
  let t = this.strCache.get(key);
  if (t) return t;
  const B = boardState(this.board);
  if (ca >= 0) boardAdd(B, ca);
  if (cb >= 0) boardAdd(B, cb);
  t = { ord: [], val: [] };
  for (let p = 0; p < 2; p++) {
    const HA = this.HA[p], HB = this.HB[p], idx = [], val = [];
    for (let h = 0; h < this.n[p]; h++) {
      const a = HA[h], b = HB[h];
      if (a === ca || a === cb || b === ca || b === cb) continue;
      idx.push(h); val.push(evalAdd2(B, a, b));
    }
    const ord = idx.map((h, i) => i).sort((x, y) => val[x] - val[y]);
    t.ord.push(Int16Array.from(ord, (i) => idx[i]));
    t.val.push(Int32Array.from(ord, (i) => val[i]));
  }
  this.strCache.set(key, t);
  return t;
};

/* 攤牌：贏拿 win、輸拿 lose、平手拿 tie（乘上對手的到達機率）。
   雙方手牌照牌力由小到大掃一次：每一組同樣牌力的手牌，記下「比它弱」和「不比它強」的對手總和（扣掉撞牌的） */
Solver.prototype.showdownCore = function (t, ca, cb, opp, out, win, lose, tie) {
  const tb = this.strengths(ca, cb), o = 1 - t;
  const ordT = tb.ord[t], valT = tb.val[t], ordO = tb.ord[o], valO = tb.val[o];
  const HAo = this.HA[o], HBo = this.HB[o], HAt = this.HA[t], HBt = this.HB[t], sm = this.same[t];
  const cw = this.cw, lt = this.tmp64, le = this.tmp64b;
  const nT = ordT.length, nO = ordO.length;
  out.fill(0);
  cw.fill(0);
  let s = 0, i = 0, j = 0;
  while (i < nT) {
    const v = valT[i];
    while (j < nO && valO[j] < v) { const g = ordO[j], x = opp[g]; if (x !== 0) { s += x; cw[HAo[g]] += x; cw[HBo[g]] += x; } j++; }
    let i2 = i;
    while (i2 < nT && valT[i2] === v) { const h = ordT[i2]; lt[h] = s - cw[HAt[h]] - cw[HBt[h]]; i2++; }
    while (j < nO && valO[j] === v) { const g = ordO[j], x = opp[g]; if (x !== 0) { s += x; cw[HAo[g]] += x; cw[HBo[g]] += x; } j++; }
    for (let q = i; q < i2; q++) { const h = ordT[q], m = sm[h]; le[h] = s - cw[HAt[h]] - cw[HBt[h]] + (m >= 0 ? opp[m] : 0); }
    i = i2;
  }
  while (j < nO) { const g = ordO[j], x = opp[g]; if (x !== 0) { s += x; cw[HAo[g]] += x; cw[HBo[g]] += x; } j++; }
  // win·lt + tie·(le − lt) + lose·(comp − le) ＝ (win − tie)·lt + (tie − lose)·le + lose·comp
  const kw = win - tie, kt = tie - lose;
  for (let q = 0; q < nT; q++) {
    const h = ordT[q], m = sm[h];
    const comp = s - cw[HAt[h]] - cw[HBt[h]] + (m >= 0 ? opp[m] : 0);
    out[h] = kw * lt[h] + kt * le[h] + lose * comp;
  }
};

Solver.prototype.terminal = function (nd, ca, cb, t, opp, out) {
  if (nd.kind === N_SHOW) {
    const inv = nd.inv0;
    this.showdownCore(t, ca, cb, opp, out, this.P0 + inv, -inv, this.P0 / 2);
  } else {
    const f = nd.p, invf = f ? nd.inv1 : nd.inv0;
    const pay = t === f ? -invf : this.P0 + invf;
    this.compat(t, opp, out);
    for (let h = 0, n = this.n[t]; h < n; h++) out[h] *= pay;
  }
};

/* 現在的策略（regret matching）、平均策略：寫進 buf（k × n） */
Solver.prototype.curStrat = function (nd, inst, buf) {
  const k = nd.k, n = nd.nh, R = this.R, base = nd.off + inst * k * n;
  for (let h = 0; h < n; h++) {
    let sum = 0;
    for (let a = 0; a < k; a++) { const x = R[base + a * n + h]; if (x > 0) sum += x; }
    if (sum > 0) { const inv = 1 / sum; for (let a = 0; a < k; a++) { const x = R[base + a * n + h]; buf[a * n + h] = x > 0 ? x * inv : 0; } }
    else { const u = 1 / k; for (let a = 0; a < k; a++) buf[a * n + h] = u; }
  }
};
Solver.prototype.avgStrat = function (nd, inst, buf) {
  const k = nd.k, n = nd.nh, S = this.S, base = nd.off + inst * k * n;
  for (let h = 0; h < n; h++) {
    let sum = 0;
    for (let a = 0; a < k; a++) sum += S[base + a * n + h];
    if (sum > 0) { const inv = 1 / sum; for (let a = 0; a < k; a++) buf[a * n + h] = S[base + a * n + h] * inv; }
    else { const u = 1 / k; for (let a = 0; a < k; a++) buf[a * n + h] = u; }
  }
};

/* 走一次樹。mode：M_CFR 訓練、M_BR 最佳反應（traverser 每手牌挑最好的動作，對手用平均策略）、M_EV 雙方都用平均策略 */
Solver.prototype.walk = function (mode, nd, inst, ca, cb, t, own, opp, out) {
  const kind = nd.kind;
  if (kind === N_FOLD || kind === N_SHOW) { this.terminal(nd, ca, cb, t, opp, out); return; }
  const sp0 = this.sp, o = 1 - t, nT = this.n[t], nO = this.n[o];
  if (kind === N_CHANCE) {
    const cOwn = this.alloc(nT), cOpp = this.alloc(nO), cOut = this.alloc(nT);
    out.fill(0);
    const child = nd.kids[0], D = this.D, deck = this.deck, wT = this.withCard[t], wO = this.withCard[o];
    for (let i = 0; i < D; i++) {
      const c = deck[i];
      if (c === ca || c === cb) continue;
      cOwn.set(own); const lt = wT[c]; for (let q = 0; q < lt.length; q++) cOwn[lt[q]] = 0;
      cOpp.set(opp); const lo = wO[c]; for (let q = 0; q < lo.length; q++) cOpp[lo[q]] = 0;
      this.walk(mode, child, inst * D + i, ca < 0 ? c : ca, ca < 0 ? -1 : c, t, cOwn, cOpp, cOut);
      for (let q = 0; q < lt.length; q++) cOut[lt[q]] = 0;
      for (let h = 0; h < nT; h++) out[h] += cOut[h];
    }
    const rem = 52 - this.board.length - nd.level;
    const f = 1 / (rem - 4);
    for (let h = 0; h < nT; h++) out[h] *= f;
    this.sp = sp0;
    return;
  }
  const k = nd.k, kids = nd.kids;
  if (nd.p === t) {
    const n = nT, vals = this.alloc(k * n), strat = this.alloc(k * n), reach = this.alloc(n);
    if (mode === M_BR) {
      for (let a = 0; a < k; a++) this.walk(mode, kids[a], inst, ca, cb, t, own, opp, vals.subarray(a * n, a * n + n));
      for (let h = 0; h < n; h++) { let m = vals[h]; for (let a = 1; a < k; a++) { const x = vals[a * n + h]; if (x > m) m = x; } out[h] = m; }
      this.sp = sp0; return;
    }
    if (mode === M_CFR) this.curStrat(nd, inst, strat); else this.avgStrat(nd, inst, strat);
    out.fill(0);
    for (let a = 0; a < k; a++) {
      const sa = strat.subarray(a * n, a * n + n), va = vals.subarray(a * n, a * n + n);
      for (let h = 0; h < n; h++) reach[h] = own[h] * sa[h];
      this.walk(mode, kids[a], inst, ca, cb, t, reach, opp, va);
      for (let h = 0; h < n; h++) out[h] += sa[h] * va[h];
    }
    if (mode === M_CFR) {
      const R = this.R, S = this.S, base = nd.off + inst * k * n, dp = this.dPos, dn = this.dNeg, ds = this.dStr;
      const rw = this.reachW;
      for (let a = 0; a < k; a++) {
        const ofs = base + a * n, ao = a * n;
        for (let h = 0; h < n; h++) {
          let r = R[ofs + h];
          r = r > 0 ? r * dp : r * dn;
          r += vals[ao + h] - out[h];
          R[ofs + h] = (r > 1e-25 || r < -1e-25) ? r : 0;          // 太小的直接歸零（避免 Float32 的次正規數拖慢）
          const x = S[ofs + h] * ds + (rw ? own[h] * strat[ao + h] : strat[ao + h]);
          S[ofs + h] = x > 1e-25 ? x : 0;
        }
      }
    }
    this.sp = sp0;
    return;
  }
  // 對手的節點
  const n = nO, strat = this.alloc(k * n), reach = this.alloc(n), tmp = this.alloc(nT);
  if (mode === M_CFR) this.curStrat(nd, inst, strat); else this.avgStrat(nd, inst, strat);
  out.fill(0);
  for (let a = 0; a < k; a++) {
    const sa = strat.subarray(a * n, a * n + n);
    let any = false;
    for (let h = 0; h < n; h++) { const x = opp[h] * sa[h]; reach[h] = x; if (x !== 0) any = true; }
    if (!any) continue;                                 // 對手不會走這條：價值是 0
    this.walk(mode, kids[a], inst, ca, cb, t, own, reach, tmp);
    for (let h = 0; h < nT; h++) out[h] += tmp[h];
  }
  this.sp = sp0;
};

/* 跑 iters 次（每次兩個玩家各更新一次）。
   折扣：正 regret × t^1.5/(t^1.5+1)、負 regret × 0.5；
   累積策略照 postflop-solver 的做法：每到 4 的次方（1、4、16、64、256…）重新開始累積，權重 ((t−p)/(t−p+1))^3 */
Solver.prototype.iterate = function (iters) {
  const o = this.cfg.dcfr || {};
  const alpha = o.alpha === undefined ? 1.5 : o.alpha, gamma = o.gamma === undefined ? 3 : o.gamma, reset = o.reset !== false;
  for (let i = 0; i < (iters || 1); i++) {
    this.t++;
    const t = this.t, tp = t - 1, pa = Math.pow(tp, alpha);
    this.dPos = tp > 0 ? pa / (pa + 1) : 0;
    this.dNeg = 0.5;
    if (reset) {
      let p4 = 1;
      while (p4 * 4 <= t) p4 *= 4;
      const tg = t - p4;
      this.dStr = Math.pow(tg / (tg + 1), gamma);
    } else this.dStr = tp > 0 ? Math.pow(tp / t, gamma) : 0;
    for (let p = 0; p < 2; p++) this.walk(M_CFR, this.root, 0, -1, -1, p, this.W[p], this.W[1 - p], this.out[p]);
  }
};

/* 期望值（平均策略）與可剝削度 */
Solver.prototype.value = function (mode, p) {
  this.walk(mode, this.root, 0, -1, -1, p, this.W[p], this.W[1 - p], this.out[p]);
  let v = 0;
  const w = this.W[p], out = this.out[p];
  for (let h = 0; h < this.n[p]; h++) v += w[h] * out[h];
  return v / this.Z;
};
Solver.prototype.exploit = function () {
  const b0 = this.value(M_BR, 0), b1 = this.value(M_BR, 1);
  const chips = (b0 + b1 - this.P0) / 2;
  return { br: [b0, b1], chips, pct: chips / this.P0 * 100 };
};
Solver.prototype.evs = function () { return [this.value(M_EV, 0), this.value(M_EV, 1)]; };

/* 解到可剝削度低於 targetPct（% 底池）或跑滿 maxIters；每 every 次檢查一次。onStep 回傳 false 就停 */
Solver.prototype.solve = function (opt) {
  const target = opt.target === undefined ? 0.5 : opt.target, maxIters = opt.maxIters || 1000, every = opt.every || 10;
  let ex = null;
  while (this.t < maxIters) {
    this.iterate(Math.min(every, maxIters - this.t));
    ex = this.exploit();
    if (opt.onStep && opt.onStep(this.t, ex) === false) break;
    if (ex.pct <= target) break;
  }
  return ex;
};

/* ===== 瀏覽：照路徑走到某個節點 =====
   path：[{a: 動作編號} 或 {c: 牌}]。回傳節點、這份資料的編號、發的牌、雙方到這裡的到達機率（平均策略） */
Solver.prototype.locate = function (path) {
  let nd = this.root, inst = 0, ca = -1, cb = -1;
  const reach = [Float32Array.from(this.W[0]), Float32Array.from(this.W[1])];
  const buf = new Float32Array(16 * Math.max(this.n[0], this.n[1]));
  for (const st of path || []) {
    if (nd.kind === N_ACT) {
      const a = st.a, n = nd.nh;
      if (!(a >= 0 && a < nd.k)) break;
      this.avgStrat(nd, inst, buf);
      const r = reach[nd.p];
      for (let h = 0; h < n; h++) r[h] *= buf[a * n + h];
      nd = nd.kids[a];
    } else if (nd.kind === N_CHANCE) {
      const c = st.c;
      if (!(c >= 0) || this.pos[c] < 0 || c === ca || c === cb) break;
      for (let p = 0; p < 2; p++) { const l = this.withCard[p][c]; for (let q = 0; q < l.length; q++) reach[p][l[q]] = 0; }
      inst = inst * this.D + this.pos[c];
      if (ca < 0) ca = c; else cb = c;
      nd = nd.kids[0];
    } else break;
  }
  return { nd, inst, ca, cb, reach };
};

/* 一個節點的完整資料（給畫面用）：雙方到達機率、輪到的人每手牌的策略、每個動作的 EV、每手牌的 EV 與勝率 */
Solver.prototype.nodeView = function (path) {
  const L = this.locate(path), nd = L.nd;
  const board = this.board.slice();
  if (L.ca >= 0) board.push(L.ca);
  if (L.cb >= 0) board.push(L.cb);
  const v = { kind: nd.kind, board, reach: L.reach, pot: this.P0 + nd.inv0 + nd.inv1, inv: [nd.inv0, nd.inv1], street: nd.street,
    hands: this.H, n: this.n };
  if (nd.kind === N_CHANCE) {
    const ok = [];
    for (let i = 0; i < this.D; i++) { const c = this.deck[i]; if (c !== L.ca && c !== L.cb) ok.push(c); }
    v.cards = ok;
    return v;
  }
  if (nd.kind !== N_ACT) return v;
  const p = nd.p, o = 1 - p, n = nd.nh, k = nd.k;
  v.p = p; v.acts = nd.acts.map((a) => ({ t: a.t, add: a.add, to: a.to, label: actLabel(a) })); v.facing = nd.facing;
  const strat = new Float32Array(k * n);
  this.avgStrat(nd, L.inst, strat);
  v.strat = strat;
  // 每個動作的 EV（每手牌）、整體 EV：對手照平均策略、自己之後也照平均策略
  const comp = this.compat(p, L.reach[o], new Float32Array(n));
  const evA = new Float32Array(k * n), tmp = new Float32Array(n);
  this.sp = 0;
  for (let a = 0; a < k; a++) {
    this.walk(M_EV, nd.kids[a], L.inst, L.ca, L.cb, p, L.reach[p], L.reach[o], tmp);
    for (let h = 0; h < n; h++) evA[a * n + h] = comp[h] > 0 ? tmp[h] / comp[h] : 0;
  }
  const ev = new Float32Array(n);
  for (let h = 0; h < n; h++) { let s = 0; for (let a = 0; a < k; a++) s += strat[a * n + h] * evA[a * n + h]; ev[h] = s; }
  v.evA = evA; v.ev = ev; v.comp = comp;
  v.eq = this.equityAt(p, L.ca, L.cb, nd.level, L.reach[o]);
  // 對手那一邊也算勝率（看範圍對範圍用）
  v.eqO = this.equityAt(o, L.ca, L.cb, nd.level, L.reach[p]);
  return v;
};

/* 每手牌對「對手現在的範圍」的勝率（發完所有牌、攤牌） */
Solver.prototype.equityAt = function (t, ca, cb, level, opp) {
  const n = this.n[t], out = new Float32Array(n);
  const rec = (ca, cb, level, oppR, res) => {
    if (this.board.length + level >= 5) { this.showdownCore(t, ca, cb, oppR, res, 1, 0, 0.5); return; }
    res.fill(0);
    const cO = new Float32Array(oppR.length), cR = new Float32Array(n);
    for (let i = 0; i < this.D; i++) {
      const c = this.deck[i];
      if (c === ca || c === cb) continue;
      cO.set(oppR); const lo = this.withCard[1 - t][c]; for (let q = 0; q < lo.length; q++) cO[lo[q]] = 0;
      rec(ca < 0 ? c : ca, ca < 0 ? -1 : c, level + 1, cO, cR);
      const lt = this.withCard[t][c]; for (let q = 0; q < lt.length; q++) cR[lt[q]] = 0;
      for (let h = 0; h < n; h++) res[h] += cR[h];
    }
    const f = 1 / (52 - this.board.length - level - 4);
    for (let h = 0; h < n; h++) res[h] *= f;
  };
  rec(ca, cb, level, opp, out);
  const comp = this.compat(t, opp, new Float32Array(n));
  for (let h = 0; h < n; h++) out[h] = comp[h] > 0 ? out[h] / comp[h] : 0;
  return out;
};

/* ===== 50-bench：預設局面、效能測試 =====
   預設局面：6 人桌 100 大盲，按鈕位（BTN）開牌 2.5、大盲（BB）跟注；底池 5.5、剩 97.5（單位：大盲）。
   範圍是常見的近似，不是解出來的。 */
const RANGE_BTN_OPEN = '22+,A2s+,K2s+,Q4s+,J6s+,T6s+,96s+,85s+,75s+,64s+,54s,A2o+,K8o+,Q9o+,J9o+,T9o';
const RANGE_BB_CALL = '22-JJ,A2s-AJs,K2s-KJs,Q4s-QJs,J6s-JTs,T6s-T9s,96s+,85s+,74s+,63s+,53s+,43s,A2o-AJo,K7o-KJo,Q8o-QJo,J8o-JTo,T8o+,98o,87o,76o';

const PRESETS = {
  river: {
    name: '河牌 K♦5♣6♥9♥2♦', board: 'Kd5c6h9h2d', pot: 5.5, stack: 97.5, tree: '下注 33%、75%、全下；加注 2.5 倍',
    bet: { river: [[33, 75], [33, 75]] }, raise: { river: [['2.5x'], ['2.5x']] }, cap: 3, target: 0.3, maxIters: 2000,
  },
  turn: {
    name: '轉牌 K♦5♣6♥9♥', board: 'Kd5c6h9h', pot: 5.5, stack: 97.5, tree: '每街一種尺寸（轉牌 66%、河牌 75%）＋全下',
    bet: { turn: [[66], [66]], river: [[75], [75]] }, raise: { turn: [['a'], ['a']], river: [['a'], ['a']] }, cap: 2, target: 0.5, maxIters: 1000,
  },
  turnBig: {
    name: '轉牌 K♦5♣6♥9♥（大樹）', board: 'Kd5c6h9h', pot: 5.5, stack: 97.5, tree: '每街兩種尺寸（轉牌 50%、100%；河牌 33%、75%）＋全下；加注 2.5 倍',
    bet: { turn: [[50, 100], [50, 100]], river: [[33, 75], [33, 75]] }, raise: { turn: [['2.5x'], ['2.5x']], river: [['2.5x'], ['2.5x']] }, cap: 3, target: 0.5, maxIters: 1000,
  },
  flop: {
    name: '翻牌 K♦5♣6♥', board: 'Kd5c6h', pot: 5.5, stack: 97.5, tree: '每街一種尺寸（翻牌 50%、轉牌 75%、河牌 75%）＋全下',
    bet: { flop: [[50], [50]], turn: [[75], [75]], river: [[75], [75]] }, raise: { flop: [['a'], ['a']], turn: [['a'], ['a']], river: [['a'], ['a']] }, cap: 2, target: 0.5, maxIters: 400,
  },
};
function presetCfg(key, over) {
  const p = Object.assign({}, PRESETS[key], over || {});
  return {
    board: parseCards(p.board), pot: p.pot, stack: p.stack,
    ranges: [parseRange(p.oop || RANGE_BB_CALL), parseRange(p.ip || RANGE_BTN_OPEN)],
    bet: p.bet, raise: p.raise, cap: p.cap, allin: 0.67, addAllin: true, maxMB: p.maxMB,
    target: p.target, maxIters: p.maxIters, name: p.name,
  };
}
function nowMs() { return (typeof performance !== 'undefined' ? performance : Date).now(); }

/* 效能測試：一項一項跑，每跑完一項呼叫 report(項目) */
function runBench(opt, report) {
  const res = [];
  const add = (r) => { res.push(r); if (report) report(r, res); };
  const rng = makeRng(2026);
  // 1. 評牌器：一百萬手隨機 7 張牌
  {
    const N = 1000000, buf = new Uint8Array(N * 7), deck = new Uint8Array(52);
    for (let c = 0; c < 52; c++) deck[c] = c;
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < 7; j++) { const r = j + ((rng() * (52 - j)) | 0); const t = deck[j]; deck[j] = deck[r]; deck[r] = t; buf[i * 7 + j] = deck[j]; }
    }
    let x = 0;
    const t0 = nowMs();
    for (let i = 0; i < N; i++) x ^= evalCards(buf, 7, i * 7);
    const ms = nowMs() - t0;
    add({ key: 'eval', name: '評牌器', value: N / ms / 1000, unit: '百萬手／秒', ms, note: '隨機 7 張牌 100 萬手' + (x === -1 ? '' : '') });
  }
  // 2. 蒙地卡羅：A♠K♠ 對 8 家，20 萬次
  {
    const t0 = nowMs();
    mcEquity(parseCards('AsKs'), [], 8, 200000, 7);
    const ms = nowMs() - t0;
    add({ key: 'mc', name: '蒙地卡羅（9 人桌）', value: 200000 / ms, unit: '千次／秒', ms, note: '每次發 9 手牌比大小' });
  }
  // 3. 精確勝率：翻牌對 1 家，所有發牌 × 所有對手手牌
  {
    const t0 = nowMs();
    exactHU(parseCards('3s4s'), parseCards('Kd5c6h'));
    const ms = nowMs() - t0;
    add({ key: 'exact', name: '精確勝率（翻牌對 1 家）', value: ms, unit: '毫秒', ms, note: '1,081 種發牌 × 990 種對手手牌' });
  }
  // 4、5. 求解：河牌、轉牌（加大樹的話再一個）
  const solves = opt.big ? ['river', 'turn', 'turnBig'] : ['river', 'turn'];
  let turnRef = null;
  for (const key of solves) {
    const cfg = presetCfg(key, { maxMB: opt.maxMB || 900 });
    let s;
    const t0 = nowMs();
    try { s = new Solver(cfg); } catch (e) {
      add({ key, name: PRESETS[key].name, value: null, unit: '', note: e.message, mem: e.mem });
      continue;
    }
    const tb = nowMs() - t0;
    const st = treeStats(s.tree);
    const t1 = nowMs();
    const ex = s.solve({ target: cfg.target, maxIters: cfg.maxIters, every: 10, onStep: opt.onStep ? (t, e) => opt.onStep(key, t, e) : null });
    const ms = nowMs() - t1;
    const r = { key, name: PRESETS[key].name, tree: PRESETS[key].tree, value: ms / 1000, unit: '秒', ms, iters: s.t, pct: ex.pct, target: cfg.target, perIter: ms / s.t,
      mem: s.memMB, nodes: st, hands: s.n, build: tb };
    if (key === 'turn') turnRef = { per: r.perIter, work: estimateSolve(cfg).work, iters: s.t };
    add(r);
  }
  // 6. 翻牌：只估（用轉牌實測的每單位運算時間推）
  if (turnRef) {
    const cfg = presetCfg('flop');
    const e = estimateSolve(cfg);
    const per = turnRef.per * e.work / turnRef.work;
    add({ key: 'flop', name: PRESETS.flop.name, tree: PRESETS.flop.tree, value: per * turnRef.iters / 1000, unit: '秒（估計）', perIter: per, iters: turnRef.iters,
      mem: e.mb, nodes: e.stats, hands: e.n, estimate: true, note: '照轉牌實測推估：記憶體 ' + Math.round(e.mb) + ' MB、每次約 ' + (per / 1000).toFixed(1) + ' 秒' });
  }
  return res;
}

</script>
<script type="text/plain" id="workersrc">
/* ===== 90-worker：背景執行緒（勝率、求解、效能測試都在這裡跑，畫面不會卡） ===== */
let SOL = null, SOL_ID = 0, stopFlag = false, calcToken = 0;
const tick = () => new Promise((r) => setTimeout(r, 0));

function drawsOf(o) {
  if (!o) return '';
  const st = o.groups.filter((g) => g.strong);
  const fl = st.find((g) => g.cat === 5), sr = st.find((g) => g.cat === 4);
  const parts = [];
  if (fl && fl.cards.length >= 8) parts.push('同花聽牌');
  if (sr) parts.push(sr.cards.length >= 8 ? '兩頭順聽牌' : '卡順聽牌');
  return parts.join('＋');
}

async function doCalc(m) {
  const token = ++calcToken;
  const hero = m.hero, board = m.board, maxOpp = m.maxOpp || 8;
  const out = { cmd: 'calc', token, hero, board };
  if (board.length === 0) {
    const g = preflopClassOf(hero);
    out.pre = preflopLookup(g);
    out.cls = g;
    out.final = true;
    postMessage(out);
    return;
  }
  const all = hero.concat(board);
  const v = evalCards(all);
  out.cur = { cat: handCat(v), txt: describeHand(v) };
  out.exact = exactHU(hero, board, null);
  const cd = catDistExact(hero, board);
  out.cat = cd ? Array.from(cd.cat) : null;
  out.outs = outsInfo(hero, board);
  out.draws = drawsOf(out.outs);
  postMessage(out);
  // 多人：蒙地卡羅，一段一段加，隨時可以被新的計算取代
  const acc = { n: 0, win: new Float64Array(maxOpp + 1), tie: new Float64Array(maxOpp + 1), tieP: new Float64Array(maxOpp + 1), cat: new Float64Array(9) };
  const total = m.mcIters || 300000;
  let seed = 1 + (Date.now() & 0xffff);
  while (acc.n < total) {
    await tick();
    if (token !== calcToken) return;
    mcEquity(hero, board, maxOpp, 25000, seed++, acc);
    postMessage({ cmd: 'calcmc', token, n: acc.n, win: Array.from(acc.win), tie: Array.from(acc.tie), tieP: Array.from(acc.tieP), done: acc.n >= total });
  }
}

async function doSolve(m) {
  stopFlag = false;
  const cfg = m.preset ? presetCfg(m.preset, { maxMB: m.maxMB || 1200 }) : m.cfg;
  let s;
  const t0 = nowMs();
  try { s = new Solver(cfg); } catch (e) { postMessage({ cmd: 'solve-error', msg: e.message, mem: e.mem }); return; }
  SOL = s; SOL_ID++;
  const id = SOL_ID;
  postMessage({ cmd: 'solve-start', id, mem: s.memMB, stats: treeStats(s.tree), hands: s.n, build: nowMs() - t0, target: cfg.target, maxIters: cfg.maxIters });
  const target = m.target || cfg.target || 0.5, maxIters = m.maxIters || cfg.maxIters || 1000;
  const t1 = nowMs();
  let ex = null, lastYield = nowMs();
  while (s.t < maxIters) {
    s.iterate(1);
    if (s.t % 10 === 0 || s.t === maxIters) {
      ex = s.exploit();
      postMessage({ cmd: 'solve-progress', id, t: s.t, pct: ex.pct, ms: nowMs() - t1 });
      if (ex.pct <= target) break;
    }
    if (nowMs() - lastYield > 150) { await tick(); lastYield = nowMs(); if (stopFlag || id !== SOL_ID) break; }
  }
  if (!ex) ex = s.exploit();
  const evs = s.evs();
  postMessage({ cmd: 'solve-done', id, t: s.t, pct: ex.pct, ms: nowMs() - t1, ev: evs, stopped: stopFlag });
}

function doView(m) {
  if (!SOL) { postMessage({ cmd: 'view', req: m.req, none: true }); return; }
  const t0 = nowMs();
  const v = SOL.nodeView(m.path || []);
  v.cmd = 'view'; v.req = m.req; v.ms = nowMs() - t0;
  v.hands = [Array.from(SOL.H[0]), Array.from(SOL.H[1])];
  v.reach = [Array.from(v.reach[0]), Array.from(v.reach[1])];
  for (const k of ['strat', 'evA', 'ev', 'comp', 'eq', 'eqO']) if (v[k]) v[k] = Array.from(v[k]);
  v.P0 = SOL.P0; v.stack = SOL.cfg.stack;
  postMessage(v);
}

async function doBench(m) {
  postMessage({ cmd: 'bench-start' });
  await tick();
  const res = runBench({ big: !!m.big, maxMB: m.maxMB || 1200, onStep: (key, t, e) => postMessage({ cmd: 'bench-step', key, t, pct: e.pct }) },
    (r) => postMessage({ cmd: 'bench-item', r }));
  postMessage({ cmd: 'bench-done', res });
}

onmessage = (e) => {
  const m = e.data;
  try {
    if (m.cmd === 'calc') doCalc(m);
    else if (m.cmd === 'solve') doSolve(m);
    else if (m.cmd === 'stop') stopFlag = true;
    else if (m.cmd === 'view') doView(m);
    else if (m.cmd === 'bench') doBench(m);
  } catch (err) { postMessage({ cmd: 'error', msg: String((err && err.message) || err) }); }
};
postMessage({ cmd: 'ready' });

</script>
<script>
(function () {
'use strict';
/* ===== 10-ui：共用的小工具、牌的畫法、背景執行緒 ===== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (x, d) => (x * 100).toFixed(d === undefined ? 1 : d);
const fmt = (x, d) => (+x).toFixed(d === undefined ? 1 : d);

/* 牌：大張（有花色大字）、文字（四色） */
function cardHTML(c, extra) {
  if (c < 0 || c === undefined) return '<span class="cd empty ' + (extra || '') + '"></span>';
  const s = c & 3;
  return '<span class="cd c' + s + ' ' + (extra || '') + '"><span class="r">' + RANK_TXT[c >> 2] + '</span><span class="s">' + SUIT_SYM[s] + '</span><span class="big">' + SUIT_SYM[s] + '</span></span>';
}
function cardSpan(c) { return '<span class="ct c' + (c & 3) + '">' + RANK_TXT[c >> 2] + SUIT_SYM[c & 3] + '</span>'; }
function comboSpan(k) {
  let a = COMBO_A[k], b = COMBO_B[k];
  if ((a >> 2) < (b >> 2) || ((a >> 2) === (b >> 2) && a > b)) { const t = a; a = b; b = t; }
  return cardSpan(a) + cardSpan(b);
}
function deckButtons(cards, used) {
  return cards.map((c) => '<button type="button" data-c="' + c + '" class="c' + (c & 3) + (used && used[c] ? ' used' : '') + '" aria-label="' + cardTxt(c) + '">'
    + RANK_TXT[c >> 2] + '<span>' + SUIT_SYM[c & 3] + '</span></button>').join('');
}
/* 52 張依花色一列：♠ ♥ ♦ ♣，每列 A→2 */
const DECK_ORDER = [];
for (let s = 0; s < 4; s++) for (let r = 12; r >= 0; r--) DECK_ORDER.push(cardOf(r, s));

/* ===== 背景執行緒 =====
   引擎的程式碼就在頁面的 <script id="engine"> 裡，拿它加上 worker 的主程式做成一個 Blob */
const W = (function makeWorker() {
  const src = $('engine').textContent + '\n' + $('workersrc').textContent;
  const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  const subs = {};
  w.onmessage = (e) => { const m = e.data; (subs[m.cmd] || []).forEach((f) => f(m)); };
  w.onerror = (e) => { console.error(e); };
  return {
    on(cmd, f) { (subs[cmd] = subs[cmd] || []).push(f); },
    send(m) { w.postMessage(m); },
  };
})();

/* 動作的顏色：棄牌藍、過牌／跟注綠、下注依大小由黃到深紅 */
const BET_COLS = ['#e2a23b', '#dc7132', '#c9462e', '#a8302c', '#7d2230'];
function actColors(acts) {
  const bets = acts.filter((a) => a.t === 'b' || a.t === 'r' || a.t === 'a');
  return acts.map((a) => {
    if (a.t === 'f') return '#4c7bc4';
    if (a.t === 'x' || a.t === 'c') return '#3f9d6a';
    const i = bets.indexOf(a), n = bets.length;
    return BET_COLS[Math.min(BET_COLS.length - 1, Math.round(i * (BET_COLS.length - 1) / Math.max(1, n - 1)) + (n === 1 ? 1 : 0))];
  });
}

/* ===== 20-calc：勝率計算機 ===== */
const CALC = {
  slots: [cardOf(1, 0), cardOf(2, 0), cardOf(11, 2), cardOf(3, 3), cardOf(4, 1), -1, -1],   // 3♠4♠，K♦5♣6♥（使用者舉的例子）
  active: 5, nOpp: 1, sent: 0, res: null, mc: null,
};
const CAT_SHORT = CAT_NAMES;

function calcHero() { const s = CALC.slots; return s[0] >= 0 && s[1] >= 0 ? [s[0], s[1]] : null; }
function calcBoard() { return CALC.slots.slice(2).filter((c) => c >= 0); }

function renderSlots() {
  const s = CALC.slots;
  const slot = (i) => '<span role="button" tabindex="0" data-slot="' + i + '" aria-label="' + (i < 2 ? '手牌第 ' + (i + 1) + ' 張' : '公牌第 ' + (i - 1) + ' 張') + (s[i] >= 0 ? '：' + cardTxt(s[i]) : '：空') + '">'
    + cardHTML(s[i], i === CALC.active ? 'on' : '') + '</span>';
  $('slots').innerHTML = '<div><h3>你的手牌</h3><div class="row">' + slot(0) + slot(1) + '</div></div>'
    + '<div><h3>公牌</h3><div class="row">' + slot(2) + slot(3) + slot(4) + '<span class="gap"></span>' + slot(5) + '<span class="gap"></span>' + slot(6) + '</div></div>';
  const used = new Uint8Array(52);
  for (const c of s) if (c >= 0) used[c] = 1;
  $('deck').innerHTML = deckButtons(DECK_ORDER, used);
}
function nextActive() {
  const s = CALC.slots;
  for (let k = 1; k <= 7; k++) { const i = (CALC.active + k) % 7; if (s[i] < 0) { CALC.active = i; return; } }
  CALC.active = -1;
}
function slotClick(i) {
  if (CALC.slots[i] >= 0) CALC.slots[i] = -1;
  CALC.active = i;
  calcChanged();
}
function deckClick(c) {
  if (CALC.slots.indexOf(c) >= 0) return;
  if (CALC.active < 0) nextActive();
  if (CALC.active < 0) return;
  CALC.slots[CALC.active] = c;
  nextActive();
  calcChanged();
}
function randomFree() {
  const used = new Set(CALC.slots.filter((c) => c >= 0));
  const free = [];
  for (let c = 0; c < 52; c++) if (!used.has(c)) free.push(c);
  return free[(Math.random() * free.length) | 0];
}

function calcChanged() {
  renderSlots();
  const hero = calcHero(), board = calcBoard();
  CALC.res = null; CALC.mc = null;
  if (!hero) { calcMsg('先放兩張手牌。'); return; }
  if (board.length === 1 || board.length === 2) { calcMsg('公牌要放到 3 張（翻牌）才能算翻牌後的機率。'); return; }
  CALC.sent++;
  W.send({ cmd: 'calc', hero, board, maxOpp: 8 });
  $('bigEq').textContent = '…';
}
function calcMsg(t) {
  $('bigEq').textContent = '—';
  $('handTxt').textContent = t; $('handSub').textContent = '';
  $('eqTab').innerHTML = ''; $('catTab').innerHTML = ''; $('outsBox').innerHTML = ''; $('eqNote').textContent = '';
}

W.on('calc', (m) => { if (m.token !== CALC.sent) return; CALC.res = m; CALC.mc = null; renderCalc(); });
W.on('calcmc', (m) => { if (m.token !== CALC.sent) return; CALC.mc = m; renderCalc(); });

function barRow(label, x, hl, txt, zero) {
  return '<tr class="' + (hl ? 'hl' : '') + (zero ? ' zero' : '') + '"><td>' + label + '</td><td><div class="bar"><i style="width:' + Math.max(0, Math.min(100, x * 100)).toFixed(1) + '%"></i></div></td><td>' + txt + '</td></tr>';
}
/* 對 N 家的勝率（0–1）；還沒算好回傳 null */
function eqFor(N) {
  const r = CALC.res;
  if (!r) return null;
  if (r.pre) return r.pre.eq[N - 1];
  if (N === 1 && r.exact) return r.exact.eq;
  const m = CALC.mc;
  return m ? (m.win[N] + m.tie[N]) / m.n : null;
}
function renderCalc() {
  const r = CALC.res;
  if (!r) return;
  const N = CALC.nOpp, hero = r.hero;
  const e = eqFor(N);
  $('bigEq').innerHTML = e === null ? '…' : pct(e) + '<small>%</small>';
  const hand = cardSpan(hero[0]) + cardSpan(hero[1]);
  let rows = '';
  for (let k = 1; k <= 8; k++) { const x = eqFor(k); rows += barRow('對 ' + k + ' 家', x || 0, k === N, x === null ? '…' : pct(x) + '%'); }
  $('eqTab').innerHTML = rows;
  if (r.pre) {
    const g = r.cls;
    $('handTxt').innerHTML = hand + '（' + esc(classTxt(g)) + '）';
    $('handSub').textContent = '翻牌前；對 ' + N + ' 家在 169 種起手牌裡排第 ' + r.pre.rank[N - 1] + ' 名';
    $('eqNote').textContent = '翻牌前的數字是預先算好的（每手模擬 100 萬次）。';
    $('catTitle').textContent = '到河牌時的牌型機率';
    $('catTab').innerHTML = r.pre.cat.map((x, i) => barRow(CAT_SHORT[i], x, false, x < 0.0005 && x > 0 ? '<0.1%' : pct(x) + '%', x === 0)).reverse().join('');
    $('outsBox').innerHTML = '';
  } else {
    $('handTxt').innerHTML = hand + '：' + esc(r.cur.txt);
    const st = ['', '', '', '翻牌', '轉牌', '河牌'][r.board.length];
    $('handSub').textContent = st + (r.draws ? '，' + r.draws : '') + '；對 ' + N + ' 家';
    const mc = CALC.mc;
    let note = '對 1 家是精確值（所有發牌、所有對手手牌都算過）。';
    if (mc) {
      const x = eqFor(Math.max(2, N)), moe = 1.96 * Math.sqrt(Math.max(1e-6, x * (1 - x)) / mc.n);
      note += '2 家以上是模擬 ' + mc.n.toLocaleString() + ' 次的結果（誤差約 ±' + pct(moe, 2) + '%）' + (mc.done ? '。' : '，還在加。');
    } else note += '2 家以上模擬中…';
    $('eqNote').textContent = note;
    if (r.board.length === 5) {
      $('catTitle').textContent = '牌型（河牌已經定了）';
      $('catTab').innerHTML = barRow(CAT_SHORT[r.cur.cat], 1, true, '100%');
    } else {
      $('catTitle').textContent = '到河牌時的牌型機率（精確）';
      $('catTab').innerHTML = r.cat.map((x, i) => barRow(CAT_SHORT[i], x, i === r.cur.cat, x === 0 ? '0' : x < 0.0005 ? '<0.1%' : pct(x) + '%', x === 0)).reverse().join('');
    }
    const o = r.outs;
    if (o) {
      let h = '<h3>出牌數（下一張讓你升級的牌）</h3>';
      if (!o.groups.length) h += '<p class="note" style="margin:0">沒有能讓你明顯升級的牌。</p>';
      for (const g of o.groups) h += '<div class="grp' + (g.strong ? '' : ' weak') + '"><b>' + (g.strong ? '' : '弱：') + esc(g.name) + ' ' + g.cards.length + ' 張</b>' + g.cards.map(cardSpan).join(' ') + '</div>';
      if (o.total) h += '<p class="note" style="margin:6px 0 0">共 ' + o.total + ' 張出牌：下一張就中 ' + pct(o.pNext) + '%' + (r.board.length === 3 ? '，到河牌至少中一張 ' + pct(o.pRiver) + '%（2–4 法則：' + o.total + ' × 4 ≈ ' + Math.min(100, o.total * 4) + '%）' : '（法則：' + o.total + ' × 2 ≈ ' + o.total * 2 + '%）') + '。</p>';
      if (o.weak) h += '<p class="note" style="margin:2px 0 0">「弱」是配成中對、底對，不算進出牌數。</p>';
      $('outsBox').innerHTML = h;
    } else $('outsBox').innerHTML = '';
  }
  renderHeat();
}

/* 169 格熱圖 */
const HEAT_STOPS = [[0x16, 0x2f, 0x28], [0x2b, 0x5e, 0x49], [0x6e, 0x9e, 0x63], [0xd6, 0xb4, 0x5a], [0xff, 0xef, 0xc0]];
function heatColor(t) {
  t = Math.max(0, Math.min(1, t)) * (HEAT_STOPS.length - 1);
  const i = Math.min(HEAT_STOPS.length - 2, Math.floor(t)), f = t - i, a = HEAT_STOPS[i], b = HEAT_STOPS[i + 1];
  const c = a.map((x, k) => Math.round(x + (b[k] - x) * f));
  return { bg: 'rgb(' + c.join(',') + ')', fg: (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) > 140 ? '#1b1608' : '#e6eee9' };
}
function renderHeat() {
  const N = CALC.nOpp;
  $('heatTitle').textContent = '起手牌強度：對 ' + N + ' 家';
  const eq = [];
  for (let g = 0; g < 169; g++) { const p = preflopLookup(g); eq.push(p.eq[N - 1]); }
  const lo = Math.min(...eq), hi = Math.max(...eq);
  const hero = calcHero(), me = hero ? preflopClassOf(hero) : -1;
  let h = '';
  for (let g = 0; g < 169; g++) {
    const c = heatColor((eq[g] - lo) / (hi - lo));
    h += '<button type="button" data-g="' + g + '" class="' + (g === me ? 'me' : '') + '" style="background:' + c.bg + ';color:' + c.fg + '" title="' + classTxt(g) + '：' + pct(eq[g]) + '%">' + className(g) + '</button>';
  }
  $('heat').innerHTML = h;
}
function heatClick(g) {
  const board = calcBoard();
  const dead = new Set(board);
  const k = CLASS_COMBOS[g].find((x) => !dead.has(COMBO_A[x]) && !dead.has(COMBO_B[x]));
  if (k === undefined) return;
  const a = COMBO_A[k], b = COMBO_B[k];
  CALC.slots[0] = Math.max(a, b); CALC.slots[1] = Math.min(a, b);
  calcChanged();
}

function initCalc() {
  let ob = '';
  for (let k = 1; k <= 8; k++) ob += '<button type="button" data-n="' + k + '" aria-pressed="' + (k === CALC.nOpp) + '">' + k + '</button>';
  $('opps').insertAdjacentHTML('beforeend', ob);
  $('opps').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-n]'); if (!b) return;
    CALC.nOpp = +b.dataset.n;
    $('opps').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderCalc(); renderHeat();
  });
  $('slots').addEventListener('click', (e) => { const t = e.target.closest('[data-slot]'); if (t) slotClick(+t.dataset.slot); });
  $('slots').addEventListener('keydown', (e) => { const t = e.target.closest('[data-slot]'); if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); slotClick(+t.dataset.slot); } });
  $('deck').addEventListener('click', (e) => { const b = e.target.closest('button[data-c]'); if (b) deckClick(+b.dataset.c); });
  $('heat').addEventListener('click', (e) => { const b = e.target.closest('button[data-g]'); if (b) heatClick(+b.dataset.g); });
  $('bDeal').addEventListener('click', () => {
    const s = CALC.slots;
    let i = 2;
    while (i < 7 && s[i] >= 0) i++;
    if (i >= 7) return;
    if (i === 2) { s[2] = randomFree(); s[3] = randomFree(); s[4] = randomFree(); } else s[i] = randomFree();
    CALC.active = -1; nextActive();
    calcChanged();
  });
  $('bNewHand').addEventListener('click', () => { CALC.slots[0] = -1; CALC.slots[1] = -1; CALC.slots[0] = randomFree(); CALC.slots[1] = randomFree(); calcChanged(); });
  $('bClearBoard').addEventListener('click', () => { for (let i = 2; i < 7; i++) CALC.slots[i] = -1; CALC.active = 2; calcChanged(); });
  calcChanged();
}

/* ===== 30-solver：求解器測試（第三步會變成完整的工作室） ===== */
const SOLV = { preset: 'river', running: false, path: [], labels: [], view: null, sel: -1, req: 0, solvedId: 0, firstPct: 0, names: ['BB', 'BTN'] };
const PRESET_TABS = [['river', '河牌'], ['turn', '轉牌'], ['turnBig', '轉牌（大樹）']];

function specText() {
  const p = PRESETS[SOLV.preset];
  return esc(p.name) + '。BB 用大盲的跟注範圍，BTN 用按鈕位的開牌範圍；底池 ' + p.pot + '、雙方各剩 ' + p.stack + '（單位：大盲）。<br>下注樹：' + esc(p.tree)
    + '。解到可剝削度低於底池的 ' + p.target + '% 就停。' + (SOLV.preset === 'turnBig' ? '<br>這棵樹比較大，手機可能要好幾分鐘。' : '');
}
function renderPresetSeg() {
  $('presetSeg').innerHTML = PRESET_TABS.map(([k, t]) => '<button type="button" data-k="' + k + '" aria-pressed="' + (k === SOLV.preset) + '">' + t + '</button>').join('');
  $('spec').innerHTML = specText();
}
function solveStart() {
  SOLV.running = true; SOLV.path = []; SOLV.labels = []; SOLV.sel = -1; SOLV.firstPct = 0;
  $('bSolve').hidden = true; $('bStop').hidden = false;
  $('prog').hidden = false; $('progTxt').textContent = '建樹中…'; $('progBar').style.width = '0'; $('progTime').textContent = '';
  W.send({ cmd: 'solve', preset: SOLV.preset });
}
W.on('solve-error', (m) => { SOLV.running = false; $('bSolve').hidden = false; $('bStop').hidden = true; $('progTxt').textContent = m.msg; });
W.on('solve-start', (m) => {
  SOLV.curId = m.id;
  $('progTxt').textContent = '樹：' + (m.stats.act[0] + m.stats.act[1] + m.stats.act[2]) + ' 個決策點，記憶體 ' + Math.max(1, Math.round(m.mem)) + ' MB；開始迭代…';
});
W.on('solve-progress', (m) => {
  if (m.id !== SOLV.curId) return;
  if (!SOLV.firstPct) SOLV.firstPct = m.pct;
  const tgt = PRESETS[SOLV.preset].target;
  const f = Math.max(0, Math.min(1, Math.log(SOLV.firstPct / m.pct) / Math.log(SOLV.firstPct / tgt)));
  $('progBar').style.width = (f * 100).toFixed(1) + '%';
  $('progTxt').textContent = '第 ' + m.t + ' 次，可剝削度 ' + fmt(m.pct, 2) + '%（目標 ' + tgt + '%）';
  $('progTime').textContent = fmt(m.ms / 1000, 1) + ' 秒';
});
W.on('solve-done', (m) => {
  if (m.id !== SOLV.curId) return;
  SOLV.running = false; SOLV.solvedId = m.id;
  $('bSolve').hidden = false; $('bStop').hidden = true;
  $('progBar').style.width = '100%';
  $('progTxt').textContent = (m.stopped ? '停在' : '完成：') + '第 ' + m.t + ' 次，可剝削度 ' + fmt(m.pct, 3) + '% 底池；EV：BB ' + fmt(m.ev[0], 2) + '、BTN ' + fmt(m.ev[1], 2);
  $('progTime').textContent = fmt(m.ms / 1000, 1) + ' 秒';
  $('sview').hidden = false;
  requestView();
});
function requestView() {
  SOLV.req++;
  $('nodeHead').innerHTML = '<p class="note">計算這個節點…</p>';
  W.send({ cmd: 'view', path: SOLV.path, req: SOLV.req });
}
W.on('view', (v) => { if (v.req !== SOLV.req || v.none) return; SOLV.view = v; renderView(); });

function renderView() {
  const v = SOLV.view, N = SOLV.names;
  // 路徑
  let cr = '<button type="button" data-step="0">開始</button>';
  SOLV.labels.forEach((t, i) => { cr += '<span>›</span><button type="button" data-step="' + (i + 1) + '">' + t + '</button>'; });
  $('crumbs').innerHTML = cr;
  $('sBoard').innerHTML = v.board.map((c) => cardHTML(c)).join('') + '<span class="note" style="margin-left:8px">底池 ' + fmt(v.pot, 1) + '，BB 剩 ' + fmt(v.stack - v.inv[0], 1) + '、BTN 剩 ' + fmt(v.stack - v.inv[1], 1) + '</span>';
  $('chancePick').hidden = true; $('gridWrap').hidden = false; $('acts').innerHTML = ''; $('sideBox').hidden = false;
  if (v.kind === 1) {                                     // 發牌
    $('nodeHead').innerHTML = '<p>' + (v.board.length === 3 ? '發轉牌' : '發河牌') + '：選一張看下一條街。</p>';
    const used = new Uint8Array(52);
    for (const c of v.board) used[c] = 1;
    $('cardPick').innerHTML = deckButtons(DECK_ORDER, used);
    $('chancePick').hidden = false; $('gridWrap').hidden = true; $('sideBox').hidden = true;
    return;
  }
  if (v.kind === 2 || v.kind === 3) {
    const last = SOLV.labels[SOLV.labels.length - 1] || '';
    $('nodeHead').innerHTML = '<p>這一手到這裡結束（' + last + '）。點上面的路徑回去。</p>';
    $('gridWrap').hidden = true; $('sideBox').hidden = true;
    return;
  }
  const p = v.p, n = v.n[p], k = v.acts.length, hands = v.hands[p], reach = v.reach[p];
  const cols = actColors(v.acts);
  // 整體頻率、EV
  let tot = 0, totC = 0, evS = 0, eqS = 0;
  const fr = new Float64Array(k);
  for (let h = 0; h < n; h++) {
    const r = reach[h]; if (!r) continue;
    tot += r;
    for (let a = 0; a < k; a++) fr[a] += r * v.strat[a * n + h];
    const w = r * v.comp[h]; totC += w; evS += w * v.ev[h]; eqS += w * v.eq[h];
  }
  $('nodeHead').innerHTML = '<p style="margin:0">輪到 <b>' + N[p] + '</b>（' + (p ? '位置內' : '位置外') + '）' + (v.facing > 0 ? '，要跟 ' + fmt(v.facing, 1) : '') + '。點一個動作往下走。</p>';
  $('acts').innerHTML = v.acts.map((a, i) => '<button type="button" data-a="' + i + '"><i class="sw" style="background:' + cols[i] + '"></i>' + esc(a.label) + '<span class="note num">' + (tot ? pct(fr[i] / tot, 0) : 0) + '%</span></button>').join('');
  $('freqTab').innerHTML = v.acts.map((a, i) => '<tr><td style="width:7.5em">' + esc(a.label) + '</td><td><div class="bar"><i style="width:' + (tot ? fr[i] / tot * 100 : 0).toFixed(1) + '%;background:' + cols[i] + '"></i></div></td><td>' + (tot ? pct(fr[i] / tot) : '0') + '%</td></tr>').join('');
  $('nodeNums').textContent = N[p] + ' 的範圍到這裡還有 ' + fmt(tot, 1) + ' 個組合；平均勝率 ' + (totC ? pct(eqS / totC) : '—') + '%，平均 EV ' + (totC ? fmt(evS / totC, 2) : '—') + '（底池 ' + fmt(v.pot, 1) + '）。';
  // 13×13 格
  const sumR = new Float64Array(169), sumA = new Float64Array(169 * k);
  for (let h = 0; h < n; h++) {
    const r = reach[h]; if (!r) continue;
    const g = CLASS_OF[hands[h]];
    sumR[g] += r;
    for (let a = 0; a < k; a++) sumA[g * k + a] += r * v.strat[a * n + h];
  }
  let gh = '';
  for (let g = 0; g < 169; g++) {
    const fill = Math.min(1, sumR[g] / classSize(g));
    let segs = '';
    if (sumR[g] > 0) for (let a = 0; a < k; a++) { const f = sumA[g * k + a] / sumR[g]; if (f > 0.001) segs += '<i style="width:' + (f * 100).toFixed(1) + '%;background:' + cols[a] + '"></i>'; }
    gh += '<button type="button" class="cell' + (g === SOLV.sel ? ' sel' : '') + '" data-g="' + g + '" aria-label="' + classTxt(g) + '"><div class="fill" style="height:' + (fill * 100).toFixed(0) + '%">' + segs + '</div><span>' + className(g) + '</span></button>';
  }
  $('grid13').innerHTML = gh;
  $('legend').innerHTML = v.acts.map((a, i) => '<span><i style="background:' + cols[i] + '"></i>' + esc(a.label) + '</span>').join('') + '<span>格子的高度＝這一格還在範圍裡的比例</span>';
  renderCell();
}
function renderCell() {
  const v = SOLV.view, g = SOLV.sel;
  if (!v || v.kind !== 0 || g < 0) { $('cellTitle').textContent = '點左邊的格子看每個組合'; $('cellBox').innerHTML = ''; return; }
  const p = v.p, n = v.n[p], k = v.acts.length, hands = v.hands[p], reach = v.reach[p], cols = actColors(v.acts);
  $('cellTitle').textContent = classTxt(g) + ' 的每個組合';
  let rows = '';
  for (let h = 0; h < n; h++) {
    if (CLASS_OF[hands[h]] !== g) continue;
    const r = reach[h];
    let bar = '';
    for (let a = 0; a < k; a++) { const f = v.strat[a * n + h]; if (f > 0.001) bar += '<i style="width:' + (f * 100).toFixed(1) + '%;background:' + cols[a] + '" title="' + esc(v.acts[a].label) + ' ' + pct(f, 0) + '%"></i>'; }
    let best = 0;
    for (let a = 1; a < k; a++) if (v.strat[a * n + h] > v.strat[best * n + h]) best = a;
    rows += '<tr' + (r < 1e-6 ? ' style="opacity:.4"' : '') + '><td>' + comboSpan(hands[h]) + '</td><td><div class="sbarh">' + bar + '</div><div class="note">' + esc(v.acts[best].label) + ' ' + pct(v.strat[best * n + h], 0) + '%</div></td><td class="r num">' + fmt(v.ev[h], 2) + '</td><td class="r num">' + pct(v.eq[h]) + '%</td><td class="r num">' + fmt(r, 2) + '</td></tr>';
  }
  $('cellBox').innerHTML = rows ? '<table class="combos"><thead><tr><th>組合</th><th>策略</th><th class="r">EV</th><th class="r">勝率</th><th class="r">權重</th></tr></thead><tbody>' + rows + '</tbody></table><p class="note">權重：這個組合打到這裡的機率（1＝一定在）。勝率是對對手現在的範圍。</p>'
    : '<p class="note">這一格不在 ' + SOLV.names[p] + ' 的範圍裡（或跟公牌撞牌）。</p>';
}

function initSolver() {
  renderPresetSeg();
  $('presetSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (!b || SOLV.running) return; SOLV.preset = b.dataset.k; renderPresetSeg(); });
  $('bSolve').addEventListener('click', solveStart);
  $('bStop').addEventListener('click', () => W.send({ cmd: 'stop' }));
  $('acts').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]'); if (!b || !SOLV.view) return;
    const a = +b.dataset.a, v = SOLV.view;
    SOLV.path.push({ a }); SOLV.labels.push(SOLV.names[v.p] + ' ' + v.acts[a].label);
    requestView();
  });
  $('cardPick').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-c]'); if (!b || b.classList.contains('used')) return;
    const c = +b.dataset.c;
    SOLV.path.push({ c }); SOLV.labels.push((SOLV.view.board.length === 3 ? '轉牌 ' : '河牌 ') + cardSpan(c));
    requestView();
  });
  $('crumbs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-step]'); if (!b) return;
    const s = +b.dataset.step;
    SOLV.path = SOLV.path.slice(0, s); SOLV.labels = SOLV.labels.slice(0, s);
    requestView();
  });
  $('grid13').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-g]'); if (!b) return;
    SOLV.sel = +b.dataset.g;
    $('grid13').querySelectorAll('.cell').forEach((x) => x.classList.toggle('sel', x === b));
    renderCell();
  });
}

/* ===== 40-bench：效能測試 ===== */
const BENCH = { res: [], running: false, t0: 0 };

function devText() {
  const n = navigator;
  return '裝置：' + (n.userAgent || '') + '；邏輯核心 ' + (n.hardwareConcurrency || '?') + (n.deviceMemory ? '；記憶體約 ' + n.deviceMemory + ' GB' : '')
    + '；螢幕 ' + screen.width + '×' + screen.height + '@' + (window.devicePixelRatio || 1);
}
function benchRow(r) {
  let v, sub = '';
  if (r.key === 'eval' || r.key === 'mc') v = fmt(r.value, r.key === 'eval' ? 2 : 0) + ' ' + r.unit;
  else if (r.key === 'exact') v = fmt(r.value, 0) + ' 毫秒';
  else if (r.value === null) v = '—';
  else v = fmt(r.value, 1) + ' ' + r.unit;
  if (r.key === 'river' || r.key === 'turn' || r.key === 'turnBig') {
    sub = '迭代 ' + r.iters + ' 次（每次 ' + fmt(r.perIter, 1) + ' 毫秒），可剝削度 ' + fmt(r.pct, 2) + '%；記憶體 ' + Math.max(1, Math.round(r.mem)) + ' MB；手牌 ' + r.hands.join('／') + '<br>' + esc(r.tree || '');
  } else if (r.key === 'flop') {
    sub = '沒有真的跑：用轉牌的實測速度推估。需要記憶體 ' + Math.round(r.mem) + ' MB；每次迭代約 ' + fmt(r.perIter / 1000, 1) + ' 秒，到 0.5% 約 ' + (r.value > 120 ? fmt(r.value / 60, 0) + ' 分鐘' : fmt(r.value, 0) + ' 秒') + '<br>' + esc(r.tree || '');
    v = r.value > 120 ? fmt(r.value / 60, 0) + ' 分鐘（估）' : fmt(r.value, 0) + ' 秒（估）';
  } else sub = esc(r.note || '');
  return '<tr><td>' + esc(r.name) + '</td><td class="v num">' + v + '</td><td class="sub">' + sub + '</td></tr>';
}
function renderBench() { $('benchTab').tBodies[0].innerHTML = BENCH.res.map(benchRow).join(''); }
function benchText() {
  const L = ['德州軍師 效能測試（第一步）', devText()];
  for (const r of BENCH.res) {
    if (r.key === 'eval') L.push('評牌器 ' + fmt(r.value, 2) + ' 百萬手/秒');
    else if (r.key === 'mc') L.push('蒙地卡羅 9 人 ' + fmt(r.value, 0) + ' 千次/秒');
    else if (r.key === 'exact') L.push('精確勝率翻牌 ' + fmt(r.value, 0) + ' ms');
    else if (r.key === 'flop') L.push('翻牌（估）每次 ' + fmt(r.perIter / 1000, 2) + ' 秒，記憶體 ' + Math.round(r.mem) + ' MB');
    else if (r.value !== null) L.push(r.name + ' ' + fmt(r.value, 2) + ' 秒，' + r.iters + ' 次，每次 ' + fmt(r.perIter, 1) + ' ms，' + fmt(r.pct, 2) + '%，' + Math.round(r.mem) + ' MB');
    else L.push(r.name + '：' + (r.note || '失敗'));
  }
  L.push('總時間 ' + fmt((Date.now() - BENCH.t0) / 1000, 0) + ' 秒');
  return L.join('\n');
}
W.on('bench-item', (m) => { BENCH.res.push(m.r); renderBench(); });
W.on('bench-step', (m) => { $('benchMsg').textContent = '正在解' + (PRESETS[m.key] ? PRESETS[m.key].name : '') + '：第 ' + m.t + ' 次，可剝削度 ' + fmt(m.pct, 2) + '%'; });
W.on('bench-done', () => {
  BENCH.running = false;
  $('bBench').disabled = false; $('bCopy').disabled = false;
  $('benchMsg').textContent = '跑完了，總共 ' + fmt((Date.now() - BENCH.t0) / 1000, 0) + ' 秒。按「複製結果」貼回對話。';
});

function initBench() {
  $('devInfo').textContent = devText();
  $('bBench').addEventListener('click', () => {
    if (BENCH.running) return;
    BENCH.running = true; BENCH.res = []; BENCH.t0 = Date.now();
    renderBench();
    $('bBench').disabled = true; $('bCopy').disabled = true;
    $('benchMsg').textContent = '測試中…';
    W.send({ cmd: 'bench', big: $('bigChk').checked });
  });
  $('bCopy').addEventListener('click', async () => {
    const t = benchText();
    try { await navigator.clipboard.writeText(t); $('benchMsg').textContent = '已複製，貼回對話就可以。'; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = t; ta.style.width = '100%'; ta.rows = 8;
      $('benchMsg').textContent = '這個瀏覽器不能自動複製，請長按下面的文字全選複製：';
      $('benchMsg').after(ta); ta.select();
    }
  });
}

/* ===== 85-main：分頁、開始 ===== */
function showTab(id) {
  for (const [t, p] of [['tCalc', 'pCalc'], ['tSolve', 'pSolve'], ['tBench', 'pBench']]) {
    const on = t === id;
    $(t).setAttribute('aria-selected', String(on)); $(p).hidden = !on;
  }
  try { localStorage.setItem('dz-tab', id); } catch (e) { /* 沒有儲存空間也沒關係 */ }
}
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button[role="tab"]'); if (b) showTab(b.id); });
document.querySelector('.tabs').addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const ids = ['tCalc', 'tSolve', 'tBench'], i = ids.indexOf(document.activeElement.id);
  if (i < 0) return;
  const j = (i + (e.key === 'ArrowRight' ? 1 : 2)) % 3;
  showTab(ids[j]); $(ids[j]).focus();
});
initCalc();
initSolver();
initBench();
try { const t = localStorage.getItem('dz-tab'); if (t && $(t)) showTab(t); } catch (e) { /* 忽略 */ }

/* ===== 90-web：只有公開網頁 App 版才有的東西：分享、安裝到主畫面、離線快取 ===== */
(function webExtras() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua);
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const shareUrl = location.origin + location.pathname + '?openExternalBrowser=1';   // LINE 看到這個參數會改用手機瀏覽器開
  let deferred = null;
  const bar = $('webbar');
  bar.innerHTML = '<button type="button" class="chip" id="btnShare">分享</button><button type="button" class="chip" id="btnInstall">安裝</button>';
  if (standalone) $('btnInstall').hidden = true;
  const toast = document.createElement('div');
  toast.setAttribute('role', 'status');
  toast.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0b1714;border:1px solid #2c5547;border-radius:10px;padding:10px 16px;max-width:min(92vw,520px);font-size:14px;z-index:50;display:none';
  document.body.appendChild(toast);
  let tt = 0;
  const say = (msg, ms) => { toast.textContent = msg; toast.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => { toast.style.display = 'none'; }, ms || 4000); };

  $('btnShare').addEventListener('click', async () => {
    const data = { title: '德州軍師', text: '德州撲克勝率計算機和 GTO 求解器，手機點開就能用：', url: shareUrl };
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(shareUrl); say('連結已複製，貼給朋友就能用。'); }
    catch (e) { say('把這個網址傳給朋友：' + shareUrl, 9000); }
  });
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; });
  $('btnInstall').addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) { /* 使用者關掉了 */ } deferred = null; return; }
    say(inApp ? '這個 App 內建的瀏覽器不能安裝。請點右上角選單，選「用預設瀏覽器開啟」，再按安裝。'
      : isIOS ? '在 Safari 點「分享」按鈕，往下找「加入主畫面」，就會多一個像 App 的圖示。'
        : '請打開瀏覽器的選單，選「安裝應用程式」或「加到主畫面」。', 9000);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* 沒有離線快取也能用 */ }); });
  }
})();

})();
</script>
